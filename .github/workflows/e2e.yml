name: e2e

# Real Flutter builds of the fixtures in e2e/, driven by the CLI: the plugin's
# native code must be in the dev build and out of the prod one. See
# e2e/README.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit, so steps run as `bash --noprofile --norc -eo pipefail`.
    shell: bash

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android / ${{ matrix.structure }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        structure: [single, workspace, path_modules, melos6, melos6_local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: the fixtures come from this version's templates. Raise it
          # deliberately, together with the fixtures.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # verify.sh runs the CLI from this checkout.
      - name: pub get
        run: dart pub get

      - name: dev
        run: e2e/tool/verify.sh ${{ matrix.structure }} android dev

      - name: prod
        if: success() || failure()
        run: e2e/tool/verify.sh ${{ matrix.structure }} android prod

  # iOS and macOS share a runner: the same Xcode, CocoaPods and dependency
  # manager, one setup.
  apple:
    name: ios, macos / ${{ matrix.manager }} / ${{ matrix.structure }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        structure: [single, workspace, path_modules]
        # CocoaPods or Swift Package Manager, for both platforms.
        manager: [cocoapods, spm]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: pub get
        run: dart pub get

      - name: ios dev
        run: e2e/tool/verify.sh ${{ matrix.structure }} ios-${{ matrix.manager }} dev

      - name: ios prod
        if: success() || failure()
        run: e2e/tool/verify.sh ${{ matrix.structure }} ios-${{ matrix.manager }} prod

      - name: macos dev
        if: success() || failure()
        run: e2e/tool/verify.sh ${{ matrix.structure }} macos-${{ matrix.manager }} dev

      - name: macos prod
        if: success() || failure()
        run: e2e/tool/verify.sh ${{ matrix.structure }} macos-${{ matrix.manager }} prod

  linux:
    name: linux / ${{ matrix.structure }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        structure: [single, workspace, path_modules]
    steps:
      - uses: actions/checkout@v4

      # What Flutter's Linux desktop build needs. Linux desktop is enabled by
      # default on stable, no `flutter config` needed.
      - name: apt-get install
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: pub get
        run: dart pub get

      # No --flavor on Linux: Flutter does not support flavors there, the
      # flavor only picks the overrides.
      - name: dev
        run: e2e/tool/verify.sh ${{ matrix.structure }} linux dev

      - name: prod
        if: success() || failure()
        run: e2e/tool/verify.sh ${{ matrix.structure }} linux prod

  min-flutter-smoke:
    name: smoke on the minimum Flutter (3.22.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # The last patch of the oldest Flutter whose Dart (3.4) the CLI
          # supports.
          flutter-version: 3.22.3
          channel: stable
          cache: true

      - name: smoke
        run: e2e/tool/smoke_min_flutter.sh
