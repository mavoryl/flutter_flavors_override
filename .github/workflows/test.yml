name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # Explicit, so steps run as `bash --noprofile --norc -eo pipefail`;
    # without it GitHub uses `bash -e` and a failure inside a pipe goes unnoticed.
    shell: bash

jobs:
  analyze-and-test:
    name: analyze + unit tests (Dart 3.12.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned, not floating `stable`: dev tooling (test, lints) is pinned to
          # this SDK. Raise it deliberately, together with those versions.
          sdk: 3.12.2

      - name: pub get
        run: dart pub get

      - name: format check
        run: dart format --output=none --set-exit-if-changed .

      - name: analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: unit tests
        run: dart test

  min-sdk:
    name: CLI on minimum SDK (Dart 3.4.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.4.0

      # No `grep -q`: it may exit before `tee` finishes writing, and under
      # pipefail the resulting SIGPIPE would fail the step.
      - name: assert SDK version
        run: |
          dart --version 2>&1 | tee /dev/stderr | grep 'Dart SDK version: 3.4.0 '

      # The package is a dependency of a throwaway consumer, so pub resolves only
      # its runtime dependencies: dev tooling needs a newer SDK and is not checked here.
      - name: create consumer package
        run: |
          mkdir consumer
          cat > consumer/pubspec.yaml <<'EOF'
          name: consumer
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter_flavor_overrides:
              path: ../package
          flavor_overrides:
            prod:
              args: 2.7.0
          EOF

      - name: pub get
        working-directory: consumer
        run: dart pub get

      # A real round trip on the minimum SDK: write the overrides file, check it,
      # then remove it again.
      - name: run CLI
        working-directory: consumer
        run: |
          dart run flutter_flavor_overrides --flavor prod
          cat pubspec_overrides.yaml
          grep -qx '# flutter_flavor_overrides: args' pubspec_overrides.yaml
          dart run flutter_flavor_overrides --clean
          test ! -e pubspec_overrides.yaml
