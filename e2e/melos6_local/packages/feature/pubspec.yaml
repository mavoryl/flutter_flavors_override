name: feature
description: >-
  Feature module of the melos6_local fixture (melos 6, no workspace): the
  package that depends on ffo_probe.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # By version, not by path: ffo_probe is a melos package here, so `melos
  # bootstrap` links it to plugins/ffo_probe through pubspec_overrides.yaml.
  ffo_probe: 0.0.1
