name: melos6_local_root
description: >-
  Root of the melos6_local fixture of the flutter_flavor_overrides e2e suite:
  melos 6 without a pub workspace, where the plugin to swap is itself a melos
  package, which `melos bootstrap` links through pubspec_overrides.yaml.
publish_to: none

environment:
  sdk: ^3.12.2

dev_dependencies:
  # Run as `dart run melos`, never activated globally.
  melos: 6.3.3
