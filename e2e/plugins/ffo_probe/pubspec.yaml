name: ffo_probe
description: >-
  Test plugin for the flutter_flavor_overrides e2e suite. Has native code on
  Android and iOS, so its footprint in a build is easy to detect.
version: 0.0.1
publish_to: none

environment:
  # Dart 3.4 (Flutter 3.22): the minimum the CLI supports, checked by
  # tool/smoke_min_flutter.sh.
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.mavoryl.ffo_probe
        pluginClass: FfoProbePlugin
      ios:
        pluginClass: FfoProbePlugin
