name: flutter_flavor_overrides
description: >-
  CLI that swaps dependencies per Flutter flavor by generating
  pubspec_overrides.yaml, so a plugin's native code stays out of flavors that
  don't need it.
version: 1.0.0
repository: https://github.com/mavoryl/flutter_flavors_override
issue_tracker: https://github.com/mavoryl/flutter_flavors_override/issues
topics:
  - flutter
  - flavors
  - cli
  - dependencies
  - pubspec

environment:
  sdk: '>=3.4.0 <4.0.0'

executables:
  flutter_flavor_overrides:

dependencies:
  args: 2.7.0
  glob: 2.2.0
  path: 1.9.1
  yaml: 3.1.4
  yaml_edit: 2.2.4

dev_dependencies:
  lints: 6.1.0
  test: 1.33.0
