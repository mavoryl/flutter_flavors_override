name: flutter_flavors_override
description: >-
  CLI that swaps dependencies per Flutter flavor by generating
  pubspec_overrides.yaml, so a plugin's native code stays out of flavors that
  don't need it.
version: 0.0.1

environment:
  sdk: '>=3.4.0 <4.0.0'

executables:
  flutter_flavors_override:

dependencies:
  args: 2.7.0
  path: 1.9.1
  yaml: 3.1.4
  yaml_edit: 2.2.4

dev_dependencies:
  lints: 6.1.0
  test: 1.33.0
